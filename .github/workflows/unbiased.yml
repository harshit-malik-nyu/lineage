name: unbiased
on:
  push:
    branches: [main]
    paths: ['scripts/sample_unbiased.py', '.unbiased-trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: unbiased
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Sample without selecting on popularity
        run: |
          mkdir -p evidence
          python scripts/sample_unbiased.py 2>&1 | tee evidence/unbiased-run.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Unbiased sample'; echo; echo '```';
            tail -25 evidence/unbiased-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: popularity-independent sample [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
