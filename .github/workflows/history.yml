name: history
on:
  push:
    branches: [main]
    paths: ['scripts/sample_history.py', '.history-trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: history
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p evidence
          python scripts/sample_history.py 2>&1 | tee evidence/history-run.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Historical sample'; echo; echo '```';
            tail -30 evidence/history-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: historical sample [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
