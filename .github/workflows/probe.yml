name: probe
on:
  push:
    branches: [main]
    paths: ['scripts/probe.py', '.probe-trigger']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Probe the lineage metadata
        run: |
          mkdir -p evidence
          python scripts/probe.py 2>&1 | tee evidence/probe-run.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Lineage probe'; echo; echo '```';
            tail -40 evidence/probe-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: lineage probe [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
