name: collect
on:
  push:
    branches: [main]
    paths: ['scripts/collect.py', '.collect-trigger']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Collect
        run: |
          mkdir -p evidence
          # No key: HuggingFace public model metadata is unauthenticated.
          python scripts/collect.py 2>&1 | tee evidence/collect-run.txt
      - name: Summary
        if: always()
        run: |
          { echo '## Lineage collection'; echo; echo '```';
            tail -35 evidence/collect-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A evidence
          git diff --staged --quiet || {
            git commit -m "evidence: lineage collection [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          }
